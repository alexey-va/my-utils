when:
  - event: [push, manual]
    branch: main

steps:
  - name: wait-github-ci
    image: alpine:3.23.3
    commands:
      - apk add --no-cache curl jq
      - |
        set -eu
        api="https://api.github.com/repos/alexey-va/my-utils/actions/workflows/ci.yml/runs?head_sha=$${CI_COMMIT_SHA}&event=push&per_page=1"
        deadline=$$(($$(date +%s) + 1800))
        while [ "$$(date +%s)" -lt "$$deadline" ]; do
          response=$$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' "$$api")
          status=$$(printf '%s' "$$response" | jq -r '.workflow_runs[0].status // "missing"')
          conclusion=$$(printf '%s' "$$response" | jq -r '.workflow_runs[0].conclusion // ""')
          case "$$status" in
            completed)
              [ "$$conclusion" = success ] && exit 0
              echo "GitHub Actions CI completed with conclusion=$$conclusion" >&2
              exit 1
              ;;
            missing|queued|in_progress|pending|requested|waiting)
              sleep 20
              ;;
            *)
              echo "Unexpected GitHub Actions status=$$status" >&2
              exit 1
              ;;
          esac
        done
        echo "Timed out waiting for GitHub Actions CI" >&2
        exit 1
    when:
      - event: push

  - name: deploy
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/freedeeml/ci:/opt/ci:ro
    environment:
      # Empty = same-origin /api via nginx (endpoints already start with /api/...)
      VITE_GRAFANA_URL: https://utils.alexeyav.ru/grafana
      # Same-origin embed: iframe from utils.alexeyav.ru cannot load temporal.alexeyav.ru (X-Frame-Options)
      VITE_TEMPORAL_URL: https://utils.alexeyav.ru/temporal
    commands:
      - apk add --no-cache bash git
      - export WORKSPACE=$${CI_WORKSPACE}
      - bash /opt/ci/deploy-my-utils.sh
