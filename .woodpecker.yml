when:
  - event: [push, manual]
    branch: main

steps:
  - name: verify
    image: node:22-alpine
    environment:
      VITE_GRAFANA_URL: https://utils.alexeyav.ru/grafana
      VITE_TEMPORAL_URL: https://utils.alexeyav.ru/temporal
    commands:
      - npm ci
      # The jsdom-heavy UI suites contend for one small CI runner when Vitest
      # executes files in parallel, causing timeout-only flakes. Keep the test
      # semantics unchanged and run files sequentially on this host.
      - npm test -- --maxWorkers=1 --fileParallelism=false
      - npm run build

  - name: deploy
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/freedeeml/ci:/opt/ci:ro
    environment:
      # Empty = same-origin /api via nginx (endpoints already start with /api/…)
      VITE_GRAFANA_URL: https://utils.alexeyav.ru/grafana
      # Same-origin embed: iframe from utils.alexeyav.ru cannot load temporal.alexeyav.ru (X-Frame-Options)
      VITE_TEMPORAL_URL: https://utils.alexeyav.ru/temporal
    commands:
      - apk add --no-cache bash git
      - export WORKSPACE=$${CI_WORKSPACE}
      - bash /opt/ci/deploy-my-utils.sh
