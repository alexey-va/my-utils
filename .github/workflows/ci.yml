name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_GRAFANA_URL: https://utils.alexeyav.ru/grafana
      VITE_TEMPORAL_URL: https://utils.alexeyav.ru/temporal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test -- --maxWorkers=1 --fileParallelism=false
      - name: Build
        run: npm run build
